name: Deploy AI Service

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Source is deployed as-is; App Service (Oryx) runs pip install from
      # requirements.txt because SCM_DO_BUILD_DURING_DEPLOYMENT=true.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: mathquest-ai
          package: ai-service
