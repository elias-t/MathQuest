name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build ourselves so VITE_API_URL is baked into the bundle (Vite inlines
      # import.meta.env at build time). Points the deployed frontend at the
      # cloud API instead of the localhost fallback in src/lib/api.ts.
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://mathquest-nest-api.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'frontend/dist' # pre-built artifact
          skip_app_build: true
          output_location: ''
